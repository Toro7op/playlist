<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>IPTV Redirector</title>
</head>
<body>
    <script>
        async function doRedirect() {
            // 1. Получаем параметры, которые прислал плеер (source, serviceArea и т.д.)
            const currentUrl = new URL(window.location.href);
            const params = currentUrl.searchParams;

            try {
                // 2. Читаем токен из соседнего файла token.txt прямо на GitHub
                const tokenResponse = await fetch('token.txt');
                if (!tokenResponse.ok) throw new Error('Token error');
                const token = (await tokenResponse.text()).trim();

                // 3. Добавляем токен к параметрам плеера
                params.set('drmreq', token);

                // 4. Строим финальную ссылку на оригинальный поток ottgoods
                // Если плеер запрашивал конкретный путь, мы можем его воссоздать
                const originalUrl = `https://sgw.ottgoods.ru${path}?${searchParams.toString()}`;

                // 5. Перенаправляем плеер
                window.location.replace(originalUrl);
            } catch (e) {
                document.body.innerText = "Ошибка загрузки токена: " + e.message;
            }
        }
        doRedirect();
    </script>
</body>
</html>
